env:
  browser: true
  es2021: true
  node: true
extend:
  - plugin:vue/vue3-essentials
  - eslint:recommendal
  - plugin:@typescript-eslint/recommended
  - '@vue/eslint-config-typescript'
  - '@vue/eslint-config-prettier/skip-formatting'
  - 'prettier'
des: []
parser: '@typescript-eslint/parser'
parserOptions:
  ecmaVersion: latest
  sourceType: module
plugins:
  - vue
  - '@typescript-eslint'
rules: {}
root: true
