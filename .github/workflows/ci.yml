name: Targeted SDK and demo delivery
on:
  pull_request:
    paths:
      - 'packages/alchemion/**'
      - 'apps/demo/**'
      - 'tests/**'
      - 'scripts/**'
      - '*config*'
      - 'package.json'
      - 'pnpm-lock.yaml'
      - 'pnpm-workspace.yaml'
      - '.node-version'
      - 'docs/**'
      - 'README.md'
      - 'AGENTS.md'
      - 'PLANS.md'
      - '.github/workflows/**'
  workflow_dispatch:
jobs:
  delivery:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    env:
      TEST_WORKERS: '4'
      LIBGL_ALWAYS_SOFTWARE: '1'
      CHANGE_BASE: ${{ github.event.action == 'synchronize' && github.event.before || github.event.pull_request.base.sha || 'HEAD^' }}
      PR_BASE: ${{ github.event.pull_request.base.sha || 'HEAD^' }}
    steps:
      - uses: actions/checkout@v7.0.1
        with:
          fetch-depth: 0
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
      - uses: actions/setup-node@v7.1.0
        with:
          node-version-file: '.node-version'
      - run: npm install --global pnpm@12.16.1
      - run: pnpm install --frozen-lockfile
      - name: Select this delivery's actual changes
        id: scope
        run: pnpm ci:changes --scope
      - name: Targeted unit cases
        run: pnpm ci:changes --unit
      - if: steps.scope.outputs.sdk == 'true'
        run: pnpm exec playwright install --with-deps chromium firefox webkit
      - name: Linux development Worker, edit and export
        if: steps.scope.outputs.demo == 'true'
        run: xvfb-run --auto-servernum pnpm dev -- --smoke
      # The development watcher rewrites dist. Rebuild production outputs before
      # running production hosts or packing the final consumer.
      - if: steps.scope.outputs.sdk == 'true'
        run: pnpm --filter alchemion build:source
      - if: steps.scope.outputs.sdk == 'true'
        run: pnpm exec tsc -p packages/alchemion/tsconfig.core.json
      - if: steps.scope.outputs.sdk == 'true'
        run: pnpm exec tsc -p tsconfig.json
      - name: Changed lint, formatting and document links
        run: pnpm ci:changes --checks
      - name: Linux independent runtime and Worker faults
        if: steps.scope.outputs.runtime == 'true'
        run: xvfb-run --auto-servernum pnpm test:browser -- --suite=runtime --prepared
      - name: Linux software-driver viewer functionality
        if: steps.scope.outputs.viewer == 'true'
        # Platform/driver coverage; hardware performance is measured separately.
        run: xvfb-run --auto-servernum pnpm test:browser -- --suite=viewer --prepared
      - name: Linux built demo user workflows
        if: steps.scope.outputs.demo == 'true'
        run: xvfb-run --auto-servernum pnpm test:browser -- --suite=demo --prepared
      - name: Linux production tarball, nested module Worker and lifecycle
        if: steps.scope.outputs.package == 'true'
        run: xvfb-run --auto-servernum pnpm test:package -- --prepared
      - uses: actions/upload-artifact@v7.0.2
        if: always()
        with:
          name: delivery-evidence
          if-no-files-found: ignore
          path: |
            .tmp/runtime-browser.json
            .tmp/viewer-browser.json
            .tmp/demo-browser.json
            .tmp/package-browser.json
            .tmp/demo-dev.json
            .tmp/package-inspection.json
            .tmp/demo-assets.json
            playwright-report
            test-results
