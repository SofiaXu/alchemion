name: M2 engineering
on:
  push:
    paths-ignore: ['**/*.md', 'docs/**']
  pull_request:
    paths-ignore: ['**/*.md', 'docs/**']
jobs:
  renderer-harness:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    env:
      LIBGL_ALWAYS_SOFTWARE: '1'
      # Four concurrent 10k-instance software viewers exhausted the first run;
      # keep the full fixture and reduce CPU contention on this runner.
      TEST_WORKERS: '2'
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24.22.1
      - run: corepack enable
      - run: pnpm install --frozen-lockfile
      - run: pnpm exec playwright install --with-deps chromium firefox webkit
      - run: pnpm build
      - run: pnpm exec tsc -p tsconfig.json
      - run: pnpm exec eslint scripts/tasks.mjs scripts/renderer-selection.mjs scripts/renderer-resources.mjs playwright.m2.config.ts eslint.config.mjs tests/renderer-selection
      - run: pnpm docs:check
      - run: xvfb-run --auto-servernum pnpm test:browser -- --phase=m2
      - run: xvfb-run --auto-servernum pnpm test:package -- --prepared
      - uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: m2-diagnostics
          path: |
            playwright-report
            test-results
