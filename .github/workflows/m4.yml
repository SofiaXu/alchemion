name: M4 formats and runtime
on:
  # Full M4 reproduction remains explicitly callable; ordinary PRs use the
  # current delivery's targeted CI instead of repeating all format tests.
  workflow_dispatch:
jobs:
  formats-runtime:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    env:
      TEST_WORKERS: '4'
      LIBGL_ALWAYS_SOFTWARE: '1'
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
      - name: Select changes for this delivery
        id: scope
        shell: bash
        env:
          PREVIOUS_HEAD: ${{ github.event.before }}
          BASE_HEAD: ${{ github.event.pull_request.base.sha }}
          EVENT_ACTION: ${{ github.event.action }}
        run: |
          base="$BASE_HEAD"
          if [ "$EVENT_ACTION" = synchronize ]; then base="${PREVIOUS_HEAD:-HEAD^}"; fi
          if [ -z "$base" ]; then base=HEAD^; fi
          echo "base=$base" >> "$GITHUB_OUTPUT"
          code=false
          while IFS= read -r file; do
            case "$file" in *.md|docs/*) ;; *) code=true;; esac
          done < <(git diff --name-only "$base" HEAD)
          echo "code=$code" >> "$GITHUB_OUTPUT"
      - uses: actions/setup-node@v4
        with:
          node-version: 24.22.1
      - run: corepack enable
      - run: pnpm install --frozen-lockfile
      - if: steps.scope.outputs.code == 'true'
        run: pnpm exec playwright install --with-deps chromium
      - name: M4 unit cases and changed model validation
        if: steps.scope.outputs.code == 'true'
        # Linux repeats only this delivery to check fixture paths and line handling.
        run: pnpm exec vitest run packages/alchemion/src/formats/cif packages/alchemion/src/formats/mol packages/alchemion/src/formats/poscar packages/alchemion/src/core/editing packages/alchemion/src/viewer/runtime packages/alchemion/src/core/__tests__/structure.test.ts --maxWorkers=4
      - if: steps.scope.outputs.code == 'true'
        run: pnpm build
      - if: steps.scope.outputs.code == 'true'
        run: pnpm exec tsc -p packages/alchemion/tsconfig.core.json
      - if: steps.scope.outputs.code == 'true'
        run: pnpm exec tsc -p tsconfig.json
      - name: Check changed source and documents
        shell: bash
        env:
          SCOPE_BASE: ${{ steps.scope.outputs.base }}
        run: |
          git diff --name-only --diff-filter=ACMR -z "$SCOPE_BASE" HEAD > .tmp-m4-changed
          mapfile -d '' changed < .tmp-m4-changed
          code=()
          formatted=()
          for file in "${changed[@]}"; do
            case "$file" in *.ts|*.mjs) code+=("$file");; esac
            case "$file" in *.ts|*.mjs|*.json|*.yaml|*.yml|*.md|*.html) formatted+=("$file");; esac
          done
          if [ ${#code[@]} -gt 0 ]; then pnpm exec eslint "${code[@]}"; fi
          if [ ${#formatted[@]} -gt 0 ]; then pnpm exec prettier --check "${formatted[@]}"; fi
      - run: pnpm docs:check
      - name: Linux production tarball and Worker consumer
        if: steps.scope.outputs.code == 'true'
        run: pnpm test:package -- --phase=m4 --prepared --project=chromium
      - uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: m4-diagnostics
          path: |
            playwright-report
            test-results
